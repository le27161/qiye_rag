# =============================================================================
# Mini RAG 跨场景路由规则配置
# =============================================================================
#
# 本文件定义所有场景共享的查询路由规则：
#   - [faq_fast_path] : FAQ 快速路径 — 短查询命中关键词时走快速路由
#   - [query_variants] : 查询变体生成规则 — 确定性词替换，不调用 LLM
#
# 各场景的专有配置（术语表、来源映射）存放在 scenarios/*/scenario.toml 中。
# =============================================================================

# ---------------------------------------------------------------------------
# FAQ 快速路径配置
#   当用户查询较短（≤48 字符）且包含以下关键词之一时，
#   系统优先检索 FAQ 集合，而不是先走文档检索。
#   - max_chars: 触发快速路径的最大查询长度
#   - hints:     触发的问句关键词列表
# ---------------------------------------------------------------------------
[faq_fast_path]
max_chars = 48
hints = [
  "怎么办",
  "如何",
  "怎么",
  "怎么处理",
  "需要什么",
  "需要哪些",
  "需要谁",
  "有哪些",
  "为什么",
  "什么时候",
  "能不能",
  "可以吗",
  "会不会",
  "是否",
  "吗",
  "什么",
  "谁",
]

# ---------------------------------------------------------------------------
# 查询变体规则配置
#   用于在检索前对用户查询进行确定性同义改写，生成多路查询变体，
#   以提高召回覆盖率。所有变体生成均为规则驱动，不调用 LLM。
#
#   - short_structured_max_chars: 结构化短查询的长度上限（≤24 字符）
#   - short_structured_markers:   触发结构化变体生成的关键词
#   - replacements:               逐条替换规则（按顺序匹配，命中则应用）
# ---------------------------------------------------------------------------
[query_variants]
short_structured_max_chars = 24
short_structured_markers = [
  "怎么走",
  "资料",
  "材料",
  "怎么排查",
  "怎么处理",
  "需要哪些",
  "能不能",
  "可以吗",
  "是什么",
  "要看什么",
]

# ---- 安装/失败/报错 互替规则 ----
# 查询包含"安装""失败""报错"任一关键词时，"失败"↔"报错"互换
[[query_variants.replacements]]
when_any = ["安装", "失败", "报错"]
replace = [
  ["失败", "报错"],
  ["报错", "失败"],
]

# ---- 流程 同义扩展规则 ----
# 查询含"流程"时，扩展为"SOP""处理步骤""办理流程"三个变体
[[query_variants.replacements]]
when_any = ["流程"]
replace = [
  ["流程", "SOP"],
  ["流程", "处理步骤"],
  ["流程", "办理流程"],
]

# ---- 发票 ↔ 开票/账单 互替规则 ----
[[query_variants.replacements]]
when_any = ["发票"]
replace = [
  ["发票", "开票"],
  ["发票", "账单"],
]

# ---- 开票 → 发票 反向替换规则 ----
# 确保"开票"也能检索到"发票"相关文档
[[query_variants.replacements]]
when_any = ["开票"]
replace = [
  ["开票", "发票"],
]

# ---- 告警 同义扩展规则 ----
# "告警"→"报警"（运维口语）和"告警"→"异常"（业务术语）
[[query_variants.replacements]]
when_any = ["告警"]
replace = [
  ["告警", "报警"],
  ["告警", "异常"],
]

# ---- webhook 中英文互译规则（忽略大小写） ----
# 英文"webhook"替换为中文"回调"，兼容中英混排查询
[[query_variants.replacements]]
when_any = ["webhook"]
ignore_case = true
replace = [
  ["webhook", "回调"],
  ["webhook", "Webhook 回调"],
]

# ---- 资料 ↔ 材料/记录 互替规则 ----
# "准备什么资料"←→"准备什么材料"←→"准备什么记录"
[[query_variants.replacements]]
when_any = ["资料"]
replace = [
  ["资料", "材料"],
  ["资料", "记录"],
]

# ---- 材料 → 资料 反向替换规则 ----
[[query_variants.replacements]]
when_any = ["材料"]
replace = [
  ["材料", "资料"],
]

# ---- "流程+怎么走" 组合规则 ----
# 需要同时包含"流程"和"怎么走"才触发（when_all）
# "怎么走"→"有哪些步骤"，"流程"→"办理流程"
[[query_variants.replacements]]
when_all = ["流程", "怎么走"]
replace = [
  ["怎么走", "有哪些步骤"],
  ["流程", "办理流程"],
]

# ---- 怎么排查 → 如何处理/处理步骤 同义替换 ----
[[query_variants.replacements]]
when_any = ["怎么排查"]
replace = [
  ["怎么排查", "如何处理"],
  ["怎么排查", "处理步骤"],
]

# ---- 能不能 → 是否可以 规范化改写 ----
[[query_variants.replacements]]
when_any = ["能不能"]
replace = [
  ["能不能", "是否可以"],
]

# ---- 可以吗 → 是否可以 规范化改写 ----
[[query_variants.replacements]]
when_any = ["可以吗"]
replace = [
  ["可以吗", "是否可以"],
]
