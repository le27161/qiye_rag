services:
  mysql:
    image: mysql:8.4
    container_name: mini-rag-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-subjects_kg}
    ports:
      - "${MINI_RAG_MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 20

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: mini-rag-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health", "--endpoints=http://127.0.0.1:2379"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 20
    stop_grace_period: 60s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: mini-rag-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "${MINI_RAG_MINIO_PORT:-9010}:9000"
      - "${MINI_RAG_MINIO_CONSOLE_PORT:-9011}:9001"
    volumes:
      - minio_data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
    stop_grace_period: 60s

  milvus:
    image: milvusdb/milvus:v2.5.15
    container_name: mini-rag-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
      MINIO_REGION: us-east-1
    ports:
      - "${MINI_RAG_MILVUS_PORT:-19540}:19530"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "10", "http://127.0.0.1:9091/healthz"]
      interval: 15s
      start_period: 180s
      timeout: 15s
      retries: 12
    stop_grace_period: 120s

  api:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PYTORCH_INDEX_URL: ${PYTORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    container_name: mini-rag-api
    restart: unless-stopped
    environment:
      ACTIVE_SCENARIO_ID: enterprise_knowledge
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-subjects_kg}
      MILVUS_URI: http://milvus:19530
      EMBEDDING_MODEL_PATH: /app/models/bge-m3
      RERANKER_MODEL_PATH: /app/models/bge-reranker-large
      EMBEDDING_MODEL_VERSION: ${EMBEDDING_MODEL_VERSION:-bge-m3-local-v1}
      RERANKER_MODEL_VERSION: ${RERANKER_MODEL_VERSION:-bge-reranker-large-local-v1}
      CHUNK_SCHEMA_VERSION: ${CHUNK_SCHEMA_VERSION:-mini-recursive-v1}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen-plus}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-60}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.1}
      RETRIEVAL_VARIANT_MAX: ${RETRIEVAL_VARIANT_MAX:-2}
      FAQ_TOP_K: ${FAQ_TOP_K:-20}
      DOC_TOP_K: ${DOC_TOP_K:-20}
      RERANK_TOP_N: ${RERANK_TOP_N:-8}
      FINAL_CONTEXT_TOP_N: ${FINAL_CONTEXT_TOP_N:-5}
      FAQ_DIRECT_SCORE_THRESHOLD: ${FAQ_DIRECT_SCORE_THRESHOLD:-0.84}
      RAG_MIN_SCORE_THRESHOLD: ${RAG_MIN_SCORE_THRESHOLD:-0.2}
      MAX_PROMPT_CONTEXT_CHARS: ${MAX_PROMPT_CONTEXT_CHARS:-5000}
    ports:
      - "${MINI_RAG_API_PORT:-8010}:8010"
    volumes:
      - ${MINI_RAG_MODELS_DIR:-../models}:/app/models:ro
      - ./config:/app/config:ro
      - ./scenarios:/app/scenarios:ro
      - ./static:/app/static:ro
    depends_on:
      mysql:
        condition: service_healthy
      milvus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8010/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5

volumes:
  mysql_data:
  etcd_data:
  minio_data:
  milvus_data:
