services:
  mysql:
    image: mysql:8.4
    container_name: knowforge-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: subjects_kg
    ports:
      - "${MYSQL_PUBLISHED_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: knowforge-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PUBLISHED_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: knowforge-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data_v2:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health", "--endpoints=http://127.0.0.1:2379"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 20
    stop_grace_period: 60s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: knowforge-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "${MINIO_API_PUBLISHED_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PUBLISHED_PORT:-9001}:9001"
    volumes:
      - minio_data_v2:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
    stop_grace_period: 60s

  milvus:
    image: milvusdb/milvus:v2.5.15
    container_name: knowforge-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
      MINIO_REGION: us-east-1
    volumes:
      - milvus_data_v2:/var/lib/milvus
    ports:
      - "${MILVUS_PUBLISHED_PORT:-19530}:19530"
      - "${MILVUS_HEALTH_PUBLISHED_PORT:-9091}:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "10", "http://127.0.0.1:9091/healthz"]
      interval: 15s
      start_period: 180s
      timeout: 15s
      retries: 12
    stop_grace_period: 120s

  api:
    build:
      context: .
      args:
        APP_BASE_IMAGE: ${APP_BASE_IMAGE:-localhost/knowforge-rag-platform-base:py312}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PYTORCH_INDEX_URL: ${PYTORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    container_name: knowforge-api
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.compose}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./models:/app/models
      - ./scenarios:/app/scenarios
      - ./reports:/app/reports
      - ./logs:/app/logs
      - ./site:/app/site:ro
      - ./static:/app/static:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5

volumes:
  mysql_data:
  redis_data:
  etcd_data_v2:
  minio_data_v2:
  milvus_data_v2:
